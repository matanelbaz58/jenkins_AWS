- name: Setup All Nodes
  hosts: all
  become: yes
  tasks:
    - name: Disable Swap
      command: swapoff -a

    - name: Install Containerd
      apt:
        name: containerd
        state: present

- name: Initialize Kubernetes Master
  hosts: master
  become: yes
  tasks:
    - name: Run kubeadm init
      command: kubeadm init --pod-network-cidr=10.244.0.0/16
      args:
        creates: /etc/kubernetes/admin.conf

    - name: Generate and save join command on Master
      shell: kubeadm token create --print-join-command > /tmp/join_command

    - name: Fetch join command to Jenkins controller
      fetch:
        src: /tmp/join_command
        dest: /tmp/join_command
        flat: yes

- name: Join Workers to Cluster
  hosts: workers
  become: yes
  tasks:
    - name: Join cluster
      command: "{{ lookup('file', '/tmp/join_command') }}"
      args:
        creates: /etc/kubernetes/kubelet.conf
